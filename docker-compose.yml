services:
  app:
    build:
      context: .
      args:
        SUPERCRONIC_VERSION: v0.2.33
    image: financial-organisation:latest
    container_name: financial-organisation
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: America/Sao_Paulo
      HEADLESS: "1"      # nunca abrir navegador no servidor
      LOG_TO_FILE: "0"   # só stdout; o Docker rotaciona os logs
      STALE_HOURS: "96"  # limite de "atraso" do heartbeat p/ o healthcheck
    volumes:
      # Guarda google-tokens.json, financial.db (+ -wal/-shm), spreadsheet-id.txt
      # e last-run.json. Precisa ser um filesystem LOCAL (não NFS/SMB): o WAL do
      # SQLite corrompe em compartilhamentos de rede.
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
